name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  # Runs the same tests against a real PostgreSQL, so the Flyway scripts are checked
  # on the database used in production, not only on H2.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stock
          POSTGRES_PASSWORD: stock
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: stock
      PGPASSWORD: stock
      SPRING_DATASOURCE_USERNAME: stock
      SPRING_DATASOURCE_PASSWORD: stock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create databases
        run: |
          psql -d postgres -c "create database fresh"
          psql -d postgres -c "create database legacy"
          # "legacy" looks like a database created before Flyway: tables exist, no Flyway history
          psql -d legacy -v ON_ERROR_STOP=1 -f src/main/resources/db/migration/V1__create_tables.sql

      - name: Tests on an empty database (Flyway runs every migration)
        run: ./mvnw -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fresh

      - name: Tests on a pre-Flyway database (Flyway baselines at V1, then runs the others)
        run: ./mvnw -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/legacy

      - name: Check the legacy database was baselined, not recreated
        run: |
          psql -d legacy -At -c "select version || ' ' || type from flyway_schema_history order by installed_rank" | tee history.txt
          grep -qx "1 BASELINE" history.txt
          grep -qx "2 SQL" history.txt
          grep -qx "3 SQL" history.txt
          grep -qx "4 SQL" history.txt
          grep -qx "5 SQL" history.txt
          grep -qx "6 SQL" history.txt
          grep -qx "7 SQL" history.txt

  # Builds the Docker image and starts the full stack with Docker Compose,
  # then sends real requests to check it works end to end.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start app and database
        run: docker compose up --build --detach --wait --wait-timeout 180
        env:
          APP_ADMIN_PASSWORD: ci-admin-password
          APP_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
          # The demo shop and its "demo" cashier, used by the end-to-end tests below
          APP_DEMO_DATA: 'true'
          APP_DEMO_PASSWORD: ci-demo-password

      - name: Smoke test the running API
        run: |
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          # Without a token the API refuses the request
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/products)" = 401
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"ci-admin-password"}' | jq -r .accessToken)
          curl -fsS -X POST http://localhost:8080/api/products \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"CI Smoke Charger","price":199.00,"quantity":10}' | tee product.json
          grep -q '"name":"CI Smoke Charger"' product.json
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://localhost:8080/api/products?search=smoke" | grep -q '"totalElements":1'
          curl -fsS -o /dev/null http://localhost:8080/swagger-ui/index.html
          # The dashboard is served at / and on its own pages (refresh on /sales/new), with its files
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/sales/new | grep -q '<div id="root">'
          ASSET=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsS -o /dev/null "http://localhost:8080$ASSET"

      # A real browser (the runner's Chrome) uses the dashboard served by the running app:
      # sales, roles, restock, refresh and logout (frontend/e2e)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: End-to-end tests in Chrome
        working-directory: frontend
        run: |
          npm ci
          npm run e2e
        env:
          BASE_URL: http://localhost:8080
          E2E_BROWSER: chrome
          E2E_ADMIN_PASSWORD: ci-admin-password
          E2E_CASHIER_PASSWORD: ci-demo-password

      - name: Keep the end-to-end report if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --volumes

  # The React dashboard in frontend/: lint, type check, tests and production build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
