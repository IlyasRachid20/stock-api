<!doctype html>
<!-- The demo shop's product pictures, drawn as SVG (no photos, no brand logos).
     scripts/demo-pictures.mjs renders each one to src/main/resources/demo/pictures/<id>.jpg -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; display: flex; flex-wrap: wrap; gap: 0; }
  svg { display: block; width: 400px; height: 400px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ebf5"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1b2a4a" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ced6"/><stop offset="0.5" stop-color="#f4f6f8"/><stop offset="1" stop-color="#a9b0ba"/>
    </linearGradient>
    <radialGradient id="lens" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3d5a8a"/><stop offset="0.45" stop-color="#101a2c"/><stop offset="1" stop-color="#05070b"/>
    </radialGradient>
  </defs>
</svg>

<!-- Galaxy S26: graphite, back with three lenses, front with a colourful screen -->

  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="205" cy="345" rx="125" ry="13" fill="#1b2a4a" opacity="0.22" filter="url(#soft)"/>
  <g transform="rotate(-9 150 205)" filter="url(#drop)">
    <rect x="88" y="70" width="122" height="262" rx="20" fill="url(#g-body)"/>
    <rect x="88" y="70" width="122" height="262" rx="20" fill="url(#gloss)"/>
    <g>
      <circle cx="116" cy="102" r="13" fill="#0e1015" stroke="#6b7280" stroke-width="2.5"/><circle cx="116" cy="102" r="8" fill="url(#lens)"/>
      <circle cx="116" cy="134" r="13" fill="#0e1015" stroke="#6b7280" stroke-width="2.5"/><circle cx="116" cy="134" r="8" fill="url(#lens)"/>
      <circle cx="116" cy="166" r="13" fill="#0e1015" stroke="#6b7280" stroke-width="2.5"/><circle cx="116" cy="166" r="8" fill="url(#lens)"/>
      <circle cx="140" cy="104" r="4" fill="#f5e6b8"/>
    </g>
  </g>
  <g transform="rotate(5 260 200)" filter="url(#drop)">
    <rect x="200" y="68" width="124" height="266" rx="21" fill="#15171c"/>
    <rect x="206" y="74" width="112" height="254" rx="16" fill="url(#g-screen)"/>
    <path d="M206 250 C 240 215, 280 285, 318 230 L 318 312 Q 318 328 302 328 L 222 328 Q 206 328 206 312 Z" fill="#ffffff" opacity="0.18"/>
    <path d="M206 140 C 250 110, 270 175, 318 130 L 318 160 C 280 200, 245 140, 206 175 Z" fill="#ffffff" opacity="0.14"/>
    <circle cx="262" cy="86" r="4" fill="#0b0c0f"/>
    <text x="262" y="160" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" font-weight="300" fill="#ffffff">10:24</text>
  </g>
</svg>
