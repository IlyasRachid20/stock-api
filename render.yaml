# Render Blueprint: deploys the API from the Dockerfile on Render's free plan.
# Render → New → Blueprint → pick this repository. Values marked "sync: false" are asked for
# during setup and never stored in Git.
services:
  - type: web
    name: stock-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # From Neon (direct connection, not the "-pooler" one, so Flyway migrations work):
      # jdbc:postgresql://<host>/<database>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Password of the private "admin" account
      - key: APP_ADMIN_PASSWORD
        sync: false
      # Random signing key generated by Render, never visible in Git
      - key: APP_JWT_SECRET
        generateValue: true
      # Public demo: sample data and a "demo" cashier account shown in the README
      - key: APP_DEMO_DATA
        value: "true"
      - key: APP_DEMO_PASSWORD
        value: "demo-cashier"
