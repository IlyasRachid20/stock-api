spring.application.name=stock-api

# Lists are paginated: ?page=0&size=20; a client can ask for at most 100 items per page
spring.data.web.pageable.max-page-size=100

# The schema is owned by the Flyway scripts in db/migration. Hibernate only checks
# at startup that the entities match the tables, and never changes the database itself.
spring.jpa.hibernate.ddl-auto=validate
# A database created before Flyway was added already has the V1 tables: mark it as
# version 1 and apply only the newer scripts. An empty database runs everything from V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Database work happens only inside the services' transactions, never while writing the JSON
# response (Spring warns at startup when this is left on)
spring.jpa.open-in-view=false
# Load related rows (a page of sales' customers, items and products) in batches instead of
# one query per row, which avoids the "N+1 queries" problem on lists
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# /actuator/health is used by Docker and hosting platforms to check the app is up; nothing else is exposed
management.endpoints.web.exposure.include=health

# Security: log in with POST /api/auth/login, then send "Authorization: Bearer <token>".
# APP_JWT_SECRET signs the tokens (at least 32 bytes). If it's not set, a random key is used
# and tokens stop working when the app restarts, which is fine for local development only.
app.security.jwt-secret=${APP_JWT_SECRET:}
app.security.token-validity=8h
# On first start (no users yet) this admin account is created. Without APP_ADMIN_PASSWORD
# a password is generated and printed once in the logs.
app.security.admin-username=admin
app.security.admin-password=${APP_ADMIN_PASSWORD:}
