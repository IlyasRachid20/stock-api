spring.application.name=stock-api

# Lists are paginated: ?page=0&size=20; a client can ask for at most 100 items per page
spring.data.web.pageable.max-page-size=100

# The schema is owned by the Flyway scripts in db/migration. Hibernate only checks
# at startup that the entities match the tables, and never changes the database itself.
spring.jpa.hibernate.ddl-auto=validate
# A database created before Flyway was added already has the V1 tables: mark it as
# version 1 and apply only the newer scripts. An empty database runs everything from V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# /actuator/health is used by Docker and hosting platforms to check the app is up; nothing else is exposed
management.endpoints.web.exposure.include=health
